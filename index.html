<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qing Dao｜Daily Planner</title>
<style>
:root{color-scheme:light;--paper:#fcf7f0;--ink:#75471e;--line:#91643e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem system-ui,sans-serif}
main{width:min(100% - 32px,1040px);margin:28px auto 48px}
header,.weather,.date{display:flex;align-items:center;gap:12px}
header{justify-content:space-between;margin-bottom:24px}
header img{width:clamp(82px,16vw,145px);height:auto;mix-blend-mode:multiply}
.date{border-bottom:1px solid var(--line);padding-bottom:5px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:transparent;border:0}
.weather{justify-content:space-between;padding:4px 12px;border:1px solid var(--line);border-bottom:0}
.icons{display:flex;gap:5px}
button{cursor:pointer;background:transparent;border:1px solid transparent;border-radius:5px;min-width:44px;min-height:44px}
button img{width:29px;height:29px;object-fit:contain;vertical-align:middle;mix-blend-mode:multiply}
button[aria-pressed=true]{background:#f0e1cf;border-color:var(--line)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td,th{border:1px solid var(--line);padding:0}
th{font-weight:500;padding:10px 2px}
textarea{display:block;width:100%;min-height:52px;field-sizing:content;resize:vertical;padding:9px 7px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
footer{display:flex;justify-content:flex-end;min-height:28px;margin-top:10px;font-size:.875rem}
.tabs{display:none}
@media(max-width:620px){
main{width:calc(100% - 24px);margin-top:16px}
header{margin-bottom:16px}
.tabs{display:flex;margin:8px 0;gap:6px}
.tabs button{flex:1;border-color:var(--line)}
[data-view=plan] .actual,[data-view=actual] .plan{display:none}
thead tr:first-child{display:none}
textarea{min-height:48px}
}
@media print{
main{margin:0;width:100%}
.tabs,footer{display:none!important}
.plan,.actual{display:table-cell!important}
thead tr:first-child{display:table-row}
tr{break-inside:avoid}
textarea{resize:none}
}

.page-switch{display:flex;gap:8px;margin:0 0 16px}
.page-switch button{padding:0 18px;border-color:var(--line)}
[hidden]{display:none!important}
.reflections,.habits,.feelings{display:grid;gap:12px}
.reflections{grid-template-columns:3fr 2fr}
.habits{grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0}
.record-card{display:grid;align-content:start;gap:8px;border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;margin:0}
.record-card textarea{padding:0;min-height:90px}
.reflections>.record-card textarea{min-height:240px}
.record-card legend{padding:0 4px}.record-card svg{vertical-align:middle;margin-right:6px}
.meal,.quantity{display:flex;align-items:center;gap:8px}
.meal input,.quantity input{min-width:0;width:100%;min-height:38px;border-bottom:1px solid var(--line);border-radius:0}
.quantity svg{flex-shrink:0}
@media(max-width:620px){.reflections,.habits{grid-template-columns:1fr}.reflections>.record-card textarea{min-height:130px}.page-switch button{flex:1}}
@media print{.page-switch{display:none}}
.record-action{border-color:var(--line);padding:0 10px}
.record-log{margin:0;padding-left:1.4rem;overflow-wrap:anywhere}
.record-log li+li{margin-top:8px}
.record-log img,.record-log audio{display:block;max-width:100%;margin:6px 0}
.record-log img{max-height:230px;object-fit:contain}
.record-card input[type=file]{width:100%;min-width:0}
.receipt-note{display:grid;gap:5px}.receipt-note input{width:100%;border-bottom:1px solid var(--line);padding:8px 0}
.record-controls{display:flex;flex-wrap:wrap;gap:8px}
.receipt-card{margin-bottom:12px}.receipt-card h2{margin:0;font-size:1.15rem}
#receipt-form,.receipts{display:grid;gap:12px}
#receipt-form>label{display:grid;gap:5px}
.receipt-scale{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.receipt-scale input{grid-column:1/-1;width:100%;min-height:36px;accent-color:var(--ink)}
.receipt-scale span:last-child{text-align:right}
#receipt-note{border:1px solid var(--line);border-radius:6px;padding:6px}
#receipt-status{margin:0}#receipt-status:empty{display:none}
.receipts{list-style:none;padding:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.receipts li{border:1px solid var(--line);border-radius:12px;padding:10px;background:#ede8f4;white-space:pre-wrap}
.receipts li+li{margin:0}
.weather{border:0;border-bottom:1px solid #d7c3ae;margin:0 0 12px;padding:0 0 10px;gap:10px}
.weather>span{font-size:.875rem;white-space:nowrap}
.weather .icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.weather button{display:grid;gap:3px;justify-items:center;align-content:center;padding:5px 7px;min-width:0;min-height:48px;font-size:.78rem;line-height:1.15;white-space:nowrap}
.weather svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.weather button[aria-pressed=true]{background:#f0e1cf;border-color:#91643e}
@media(max-width:420px){.weather .icons{flex:1}.weather button{padding-inline:2px}}
.brand span{font-size:.85rem;letter-spacing:.08em}.brand h1{font-size:clamp(1.2rem,4vw,2rem);margin:1px 0 0}
.date{flex-wrap:wrap;gap:4px 8px}.date input{max-width:100%}
.priority-panel{margin:16px 0 20px;padding:14px;border:1px solid var(--line);border-radius:12px}
.priority-panel h2,.time-title{font-size:1.1rem;margin:0 0 8px}
.priority-panel ol{margin:0;padding-left:1.5rem}
.priority-panel label{display:flex;gap:8px;align-items:center;border-bottom:1px solid #d7c3ae;min-height:42px}
.priority-panel input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px}
.priority-panel input[type=text]{flex:1;min-width:0;min-height:38px}
.priority-panel input:checked+input{text-decoration:line-through}
.weather button{white-space:normal}
@media(max-width:420px){.weather .icons{min-width:0}.weather button{font-size:.75rem}.weather button span{max-width:100%}}
</style>
<main id="planner" data-view="plan">
<header><div class="brand"><span>Qing Dao</span><h1>Daily Planner</h1></div><label class="date">Date <input id="date" type="date" aria-label="Date" required></label></header>
<nav class="page-switch" aria-label="Planner pages"><button type="button" aria-controls="schedule-page" aria-pressed="true">Schedule</button><button type="button" aria-controls="record-page" aria-pressed="false">Daily Log</button></nav>
<section id="schedule-page" aria-label="Schedule">
<section class="weather" aria-label="Choose weather"><span>Weather</span><div class="icons" id="weather"></div></section>
<div class="tabs" role="group" aria-label="Schedule view">
<button type="button" data-view="plan" aria-pressed="true">Planned</button>
<button type="button" data-view="actual" aria-pressed="false">Actual</button>
</div>
<section class="priority-panel" aria-labelledby="priority-title">
<h2 id="priority-title">Top 3 Priorities</h2>
<ol><li><label><input type="checkbox" data-priority-done="priority1Done" aria-label="Complete priority 1"><input type="text" data-record="priority1" aria-label="Priority 1" placeholder="Priority 1"></label></li><li><label><input type="checkbox" data-priority-done="priority2Done" aria-label="Complete priority 2"><input type="text" data-record="priority2" aria-label="Priority 2" placeholder="Priority 2"></label></li><li><label><input type="checkbox" data-priority-done="priority3Done" aria-label="Complete priority 3"><input type="text" data-record="priority3" aria-label="Priority 3" placeholder="Priority 3"></label></li></ol>
</section>
<h2 class="time-title">Time Blocks</h2>
<table aria-label="Time Blocks">
<colgroup><col class="plan" style="width:11%"><col class="plan"><col class="plan"><col class="actual" style="width:11%"><col class="actual"><col class="actual"></colgroup>
<thead>
<tr><th class="plan" colspan="3" scope="colgroup">Planned</th><th class="actual" colspan="3" scope="colgroup">Actual</th></tr>
<tr id="headings"></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</section>
<section id="record-page" aria-label="Daily Log" hidden>
<div class="reflections"><label class="record-card">Daily Review<textarea data-record="reflection" rows="3"></textarea></label><div class="feelings"><section class="record-card">
<label>Mood<textarea data-record="mood" rows="3"></textarea></label>
<div class="record-controls"><button class="record-action" type="button" id="voice-start">Start recording</button><button class="record-action" type="button" id="voice-stop" disabled>Stop recording</button></div>

<ul class="record-log" id="mood-log"></ul>
</section><label class="record-card">Physical Well-being<textarea data-record="body" rows="3"></textarea></label></div></div>
<div class="habits">
<fieldset class="record-card"><legend><svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h22M5 17a9 9 0 0 1 18 0M14 8V5m-2 0h4"/></svg>Meals</legend><label class="meal">Breakfast<input type="text" data-record="breakfast"></label><label class="meal">Lunch<input type="text" data-record="lunch"></label><label class="meal">Dinner<input type="text" data-record="dinner"></label></fieldset>
<form class="record-card" id="water-form"><label>Amount (ml)<span class="quantity"><input id="water-amount" type="number" min="1" step="1" inputmode="numeric" required></span></label>
<button class="record-action" type="submit">Log Water</button><output id="water-total"></output><ul class="record-log" id="water-log"></ul></form>
<section class="record-card" aria-label="Sleep">Sleep
<div class="record-controls"><button class="record-action" type="button" id="sleep-start">Start Sleep</button><button class="record-action" type="button" id="sleep-stop" disabled>End Sleep</button></div>
<output id="sleep-active"></output><output id="sleep-total"></output><ul class="record-log" id="sleep-log"></ul></section>
</div><section class="record-card receipt-card" aria-labelledby="receipt-title">
<h2 id="receipt-title">Receipts</h2>
<form id="receipt-form">
<label>Choose photos (multiple allowed)<input type="file" id="receipt-photo" accept="image/*" multiple></label>
<label>Take a photo<input type="file" id="receipt-camera" accept="image/*" capture="environment"></label>
<label class="receipt-note">Emotion tag or Emoji<input id="receipt-emotion" type="text" placeholder="e.g. Happy 😊" maxlength="60"></label>
<div class="receipt-scale"><label for="receipt-strength">Intensity</label><output id="strength-value" for="receipt-strength">5 / 10</output><input id="receipt-strength" type="range" min="0" max="10" value="5" step="1"><span>0 · None</span><span>10 · Very strong</span></div>
<label class="receipt-note">Reason for purchase<input id="receipt-reason" type="text" required></label>
<label class="receipt-note">Notes<textarea id="receipt-note" rows="2"></textarea></label>
<button class="record-action" type="submit">Save Receipt</button><p id="receipt-status" role="status"></p>
</form><ul class="record-log receipts" id="receipt-log"></ul></section>
<label class="record-card">To-Do<textarea data-record="todos" rows="3"></textarea></label>
</section>
<footer><span id="status" role="status"></span></footer>
</main>
<script>
const planner = document.querySelector('#planner')
const date = document.querySelector('#date')
const status = document.querySelector('#status')
const weather = document.querySelector('#weather')
const headings = document.querySelector('#headings')
const rows = document.querySelector('#rows')
const fields = []
let entry
let activeDate
const drafts = new Map()

for (const [side, group] of [['plan','Planned'],['actual','Actual']]) {
  for (const label of ['Time','Task','Notes']) {
    fields.push({side, group, label})
    const th = document.createElement('th')
    th.scope = 'col'
    th.className = side
    th.textContent = label
    headings.append(th)
  }
}

const inputs = []
for (let row = 0; row < 18; row++) {
  const tr = rows.insertRow()
  fields.forEach(({side, group, label}, column) => {
    const cell = tr.insertCell()
    cell.className = side
    const input = document.createElement('textarea')
    input.rows = 1
    input.setAttribute('aria-label', group + ' block ' + (row + 1) + ' ' + label)
    input.addEventListener('input', () => {
      entry.cells[row * fields.length + column] = input.value
      save()
    })
    cell.append(input)
    inputs.push(input)
  })
}

const weatherButtons = new Map()
for (const [key, label] of [['snow','Snow'],['sun','Sunny'],['rain','Rain'],['cloud','Partly cloudy']]) {
  const button = document.createElement('button')
  button.type = 'button'
  button.title = label
  const paths = {"snow":"M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 4l3 3 3-3m-6 16 3-3 3 3M4 10l4-1-1-4m10 14-1-4 4-1M4 14l4 1-1 4m10-14-1 4 4 1","sun":"M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4","rain":"M6 14a3.5 3.5 0 0 1-.5-7A5 5 0 0 1 15 6a4 4 0 1 1 2.4 8ZM9 17l-1.3 3m5.3-3-1.3 3m5.3-3-1.3 3","cloud":"M14 7a4 4 0 0 1 6.4 2.5M17 2v1.5M22 4l-1 1M6 19a3.5 3.5 0 0 1-.3-7A5 5 0 0 1 15 11a4 4 0 1 1 2.4 8Z"}
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  const path = document.createElementNS(svg.namespaceURI, 'path')
  path.setAttribute('d', paths[key])
  svg.append(path)
  const caption = document.createElement('span')
  caption.textContent = label
  button.append(svg, caption)
  button.addEventListener('click', () => {
    entry.weather = entry.weather === key ? '' : key
    updateWeather()
    save()
  })
  weather.append(button)
  weatherButtons.set(key, button)
}

const tabs = [...document.querySelectorAll('.tabs button')]
for (const tab of tabs) {
  tab.addEventListener('click', () => {
    planner.dataset.view = tab.dataset.view
    tabs.forEach(button => button.setAttribute('aria-pressed', String(button === tab)))
  })
}

const pageButtons = [...document.querySelectorAll('.page-switch button')]
for (const button of pageButtons) {
  button.addEventListener('click', () => {
    for (const tab of pageButtons) {
      const selected = tab === button
      tab.setAttribute('aria-pressed', String(selected))
      document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected
    }
  })
}

const recordInputs = [...document.querySelectorAll('[data-record]')]
for (const input of recordInputs) {
  input.addEventListener('input', () => {
    if (!input.validity.valid) {
      status.textContent = 'Enter a valid number'
      return
    }
    entry.record ??= {}
    entry.record[input.dataset.record] = input.value
    save()
  })
}

const byId = id => document.getElementById(id)
const sleepKey = 'qingdao-active-sleep'
let sleeping
try { sleeping = JSON.parse(localStorage.getItem(sleepKey)) } catch {}
const clock = new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit'})
const time = timestamp => clock.format(timestamp)
const duration = ms => {
  const minutes = Math.max(0, Math.floor(ms / 60000))
  return Math.floor(minutes / 60) + ' hr ' + minutes % 60 + ' min'
}
function renderList(id, labels) {
  byId(id).replaceChildren(...labels.map(label => {
    const li = document.createElement('li')
    li.textContent = label
    return li
  }))
}
function renderTracking() {
  const record = entry.record ?? {}
  const water = record.waterEvents ?? []
  const sleep = record.sleepEvents ?? []
  const legacyWater = Number(record.water) || 0
  const legacySleep = (Number(record.sleep) || 0) * 3600000
  byId('water-total').textContent = 'Daily water total ' + (legacyWater + water.reduce((sum, item) => sum + item.ml, 0)) + ' ml'
  byId('sleep-total').textContent = 'Daily sleep total ' + duration(legacySleep + sleep.reduce((sum,item) => sum + item.end - item.start,0))
  renderList('water-log', [...(legacyWater ? ['Previous entry ' + legacyWater + ' ml'] : []), ...water.map(item => time(item.at) + ' · ' + item.ml + ' ml')])
  renderList('sleep-log', [...(legacySleep ? ['Previous entry ' + duration(legacySleep)] : []), ...sleep.map(item => time(item.start) + ' to ' + time(item.end) + ' · ' + duration(item.end - item.start))])
  byId('sleep-start').disabled = Boolean(sleeping)
  byId('sleep-stop').disabled = !sleeping
  byId('sleep-active').textContent = sleeping ? 'In progress · ' + sleeping.day + ' ' + time(sleeping.start) : ''
}
const localDay = (now = new Date()) => [now.getFullYear(),now.getMonth()+1,now.getDate()].map(n => String(n).padStart(2,'0')).join('-')
byId('water-form').addEventListener('submit', event => {
  event.preventDefault()
  const input = byId('water-amount')
  entry.record ??= {}
  entry.record.waterEvents ??= []
  entry.record.waterEvents.push({at:Date.now(),ml:input.valueAsNumber})
  input.value = ''
  save()
  renderTracking()
})
byId('sleep-start').addEventListener('click', () => {
  const start = {start:Date.now(),day:localDay()}
  try {
    localStorage.setItem(sleepKey,JSON.stringify(start))
    sleeping = start
    renderTracking()
  } catch { status.textContent = 'Could not save the sleep start time' }
})
byId('sleep-stop').addEventListener('click', () => {
  if (!sleeping) return
  const key = 'qingdao-daily-v1:' + sleeping.day
  try {
    const target = drafts.get(sleeping.day) ?? JSON.parse(localStorage.getItem(key)) ?? {weather:'',cells:{}}
    target.record ??= {}
    const list = target.record.sleepEvents ??= []
    if (!list.some(item => item.start === sleeping.start)) {
      const item = {start:sleeping.start,end:Date.now()}
      localStorage.setItem(key,JSON.stringify({...target,record:{...target.record,sleepEvents:[...list,item]}}))
      list.push(item)
    }
    localStorage.removeItem(sleepKey)
    drafts.set(sleeping.day,target)
    status.textContent = 'Sleep logged for ' + sleeping.day
    sleeping = null
    renderTracking()
  } catch { status.textContent = 'Could not save sleep. Try again.' }
})

let mediaDB
function database() {
  if (!mediaDB) mediaDB = new Promise((resolve,reject) => {
    const request = indexedDB.open('qingdao-mood-media',1)
    request.onupgradeneeded = () => request.result.createObjectStore('items',{keyPath:'id',autoIncrement:true}).createIndex('day','day')
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
  return mediaDB
}
async function addMedia(item) {
  const db = await database()
  return new Promise((resolve,reject) => {
    const tx = db.transaction('items','readwrite')
    tx.objectStore('items').add(item)
    tx.oncomplete = resolve
    tx.onabort = () => reject(tx.error)
  })
}
let mediaUrls = []
let mediaRender = 0
async function showMedia(day) {
  const turn = ++mediaRender
  for (const url of mediaUrls) URL.revokeObjectURL(url)
  mediaUrls = []
  const list = byId('mood-log')
  const receipts = byId('receipt-log')
  list.replaceChildren()
  receipts.replaceChildren()
  try {
    const db = await database()
    const items = await new Promise((resolve,reject) => {
      const request = db.transaction('items').objectStore('items').index('day').getAll(day)
      request.onsuccess = () => resolve(request.result)
      request.onerror = () => reject(request.error)
    })
    if (turn !== mediaRender) return
    for (const item of items) {
      const li = document.createElement('li')
      const details = item.kind === 'audio' ? ['Mood recording'] : [
        item.emotion && 'Emotion · ' + item.emotion,
        Number.isInteger(item.strength) && 'Intensity · ' + item.strength + ' / 10',
        item.reason && 'Reason for purchase · ' + item.reason,
        item.note && 'Notes · ' + item.note
      ].filter(Boolean)
      li.textContent = [time(item.at),...details].join('\n')
      const blobs = item.photos ?? [item.blob]
      for (const [index, blob] of blobs.entries()) {
        const media = document.createElement(item.kind === 'audio' ? 'audio' : 'img')
        const url = URL.createObjectURL(blob)
        mediaUrls.push(url)
        media.src = url
        if (item.kind === 'audio') media.controls = true
        else media.alt = 'Receipt photo ' + (index + 1)
        li.append(media)
      }
      const destination = item.kind === 'audio' ? list : receipts
      destination.append(li)
    }
  } catch {
    if (turn === mediaRender) {
      list.textContent = 'Could not load recordings in this browser'
      receipts.textContent = 'Could not load receipt photos in this browser'
    }
  }
}
const receiptForm = byId('receipt-form')
const photo = byId('receipt-photo')
const camera = byId('receipt-camera')
const strength = byId('receipt-strength')
const receiptStatus = byId('receipt-status')
function showStrength() { byId('strength-value').value = strength.value + ' / 10' }
function resetReceipt() {
  receiptForm.reset()
  showStrength()
  receiptStatus.textContent = ''
}
strength.addEventListener('input',showStrength)

receiptForm.addEventListener('submit',async event => {
  event.preventDefault()
  const form = event.currentTarget
  const reason = byId('receipt-reason').value.trim()
  const photos = [...photo.files, ...camera.files]
  if (!reason || !photos.length) {
    receiptStatus.textContent = 'Enter a reason and attach a receipt photo'
    return
  }
  const day = activeDate
  const submit = form.querySelector('button')
  submit.disabled = true
  try {
    await addMedia({day,at:Date.now(),kind:'receipt',reason,photos,
      emotion:byId('receipt-emotion').value.trim(),
      strength:strength.valueAsNumber,
      note:byId('receipt-note').value.trim()})
    if (activeDate === day) {
      resetReceipt()
      await showMedia(day)
      receiptStatus.textContent = 'Receipt saved'
    }
  } catch { receiptStatus.textContent = 'Could not save the receipt. Try again.' }
  finally { submit.disabled = false }
})
let recorder
byId('voice-start').addEventListener('click',async () => {
  const start = byId('voice-start')
  const stop = byId('voice-stop')
  const day = activeDate
  start.disabled = true
  let stream
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true})
    recorder = new MediaRecorder(stream)
    const chunks = []
    const at = Date.now()
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data) }
    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop())
      try {
        const blob = new Blob(chunks,{type:recorder.mimeType})
        if (!blob.size) throw new Error('empty recording')
        await addMedia({day,at,kind:'audio',blob})
        if (day === activeDate) await showMedia(day)
        status.textContent = 'Recording saved for ' + day
      } catch { status.textContent = 'Could not save the recording. Try again.' }
      finally { start.disabled = false }
    }
    recorder.start()
    stop.disabled = false
    status.textContent = 'Recording'
  } catch {
    stream?.getTracks().forEach(track => track.stop())
    start.disabled = false
    status.textContent = 'Could not start recording. Check microphone permissions.'
  }
})
byId('voice-stop').addEventListener('click', () => {
  byId('voice-stop').disabled = true
  if (recorder?.state === 'recording') recorder.stop()
})
const priorityChecks = [...document.querySelectorAll('[data-priority-done]')]
for (const checkbox of priorityChecks) {
  checkbox.addEventListener('change', () => {
    entry.record ??= {}
    entry.record[checkbox.dataset.priorityDone] = checkbox.checked
    save()
  })
}
function updateWeather() {
  for (const [key, button] of weatherButtons) {
    button.setAttribute('aria-pressed', String(entry.weather === key))
  }
}
function storageKey() {
  return 'qingdao-daily-v1:' + activeDate
}
function load() {
  if (!date.value || !date.validity.valid) {
    date.value = activeDate
    return
  }
  activeDate = date.value
  status.textContent = ''
  entry = drafts.get(activeDate)
  if (!entry) {
    try {
      entry = JSON.parse(localStorage.getItem(storageKey()))
    } catch {
      status.textContent = 'Could not load saved entries in this browser'
    }
    entry ??= {weather:'',cells:{}}
    drafts.set(activeDate, entry)
  }
  inputs.forEach((input, index) => { input.value = entry.cells[index] ?? '' })
  for (const input of recordInputs) {
    input.value = entry.record?.[input.dataset.record] ?? ''
  }
  for (const checkbox of priorityChecks) {
    checkbox.checked = entry.record?.[checkbox.dataset.priorityDone] === true
  }
  resetReceipt()
  byId('water-form').reset()
  renderTracking()
  void showMedia(activeDate)
  updateWeather()
}
function save() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(entry))
    status.textContent = 'Saved on this device'
  } catch {
    status.textContent = 'Could not save. Your entry is still on this page.'
  }
}
const now = new Date()
date.value = [now.getFullYear(),now.getMonth()+1,now.getDate()].map(n => String(n).padStart(2,'0')).join('-')
date.addEventListener('change', load)
load()
</script>
</html>
